name: CI/CD Build and Deploy

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hanihome-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build success notification
        run: echo "Docker 이미지 빌드 및 푸시 완료!"

  deploy:
    runs-on: ubuntu-latest
    needs: build  # build job이 성공적으로 완료된 후에 실행

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            echo "[시작] 배포 프로세스 시작..."
            
            # Docker 디스크 정리
            echo "Docker 시스템 정리 중..."
            sudo docker system prune -f
            
            # 최신 이미지 pull
            echo "최신 Docker 이미지 다운로드 중..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hanihome-server:latest
            
            # 기존 컨테이너 중지 및 제거
            echo "기존 서비스 중지 중..."
            sudo docker-compose down
            
            # 새 컨테이너 시작
            echo "새 서비스 시작 중..."
            sudo docker-compose up -d
            
            # 헬스체크
            echo "서비스 상태 확인 중..."
            sleep 10
            if sudo docker-compose ps | grep -q "Up"; then
              echo "서비스가 정상적으로 시작되었습니다!"
            else
              echo "서비스 시작에 문제가 있습니다."
              sudo docker-compose logs
              exit 1
            fi
            
            echo "[성공] 배포 완료"

      - name: Deploy success notification
        run: echo "EC2 배포 완료!"