groups:
  - name: spring-boot-alerts
    rules:
      # HTTP 요청 관련 알림
      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: hanihome-backend
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "HTTP 5xx error rate is above 10% for more than 5 minutes"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: hanihome-backend
        annotations:
          summary: "High HTTP response time"
          description: "95th percentile response time is above 2 seconds"

      # JVM 관련 알림
      - alert: HighJvmMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          service: hanihome-backend
        annotations:
          summary: "High JVM heap memory usage"
          description: "JVM heap memory usage is above 85% for more than 5 minutes"

      - alert: HighGcTime
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: hanihome-backend
        annotations:
          summary: "High GC time"
          description: "GC time is consuming more than 10% of CPU time"

      # 애플리케이션 상태 알림
      - alert: ApplicationDown
        expr: up{job="hanihome-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: hanihome-backend
        annotations:
          summary: "Hanihome backend is down"
          description: "Hanihome backend application has been down for more than 2 minutes"

      - alert: HighCpuUsage
        expr: system_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          service: hanihome-backend
        annotations:
          summary: "High CPU usage"
          description: "System CPU usage is above 80% for more than 5 minutes"

  - name: database-alerts
    rules:
      # 데이터베이스 연결 관련 (Spring Boot가 HikariCP 사용하는 경우)
      - alert: HighDatabaseConnectionUsage
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connection usage"
          description: "Database connection pool usage is above 80%"

      - alert: DatabaseConnectionTimeout
        expr: rate(hikaricp_connections_timeout_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection timeouts detected"
          description: "Database connections are timing out"

  - name: logging-alerts
    rules:
      - alert: HighLogVolumeSpring
        expr: rate(logback_events_total[5m]) > 100
        for: 10m
        labels:
          severity: warning
          service: logging
        annotations:
          summary: "High log volume detected"
          description: "Application log rate is unusually high (>100 logs/sec)"

      - alert: HighErrorLogRate
        expr: rate(logback_events_total{level="error"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: logging
        annotations:
          summary: "High error log rate"
          description: "Error log rate is above 1/sec for more than 5 minutes"