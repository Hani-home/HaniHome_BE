apiVersion: 1

datasources:
  # Loki 데이터소스
  - name: Loki
    type: loki
    access: proxy
    url: http://hanihome-loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "${__value.raw}"

  # Prometheus 데이터소스
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://hanihome-prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.50.1
      cacheLevel: 'High'
      disableMetricsLookup: false
      incrementalQuerying: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: loki