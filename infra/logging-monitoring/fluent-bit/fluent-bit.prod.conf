[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Logging Driver로부터 로그 수집
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Tag               docker.webapp

# Spring Boot 로그 파싱 및 구조화
[FILTER]
    Name                parser
    Match               docker.webapp
    Key_Name            log
    Parser              spring_boot
    Reserve_Data        On
    Preserve_Key        On

# 파싱 실패한 로그를 JSON으로 재시도
[FILTER]
    Name                parser
    Match               docker.webapp
    Key_Name            log
    Parser              spring_boot_json
    Reserve_Data        On
    Preserve_Key        On

# 로그 레벨 정규화 (대문자로 통일)
[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_exists level
    Set                 log_level ${level}

# 공통 필드 추가
[FILTER]
    Name                modify
    Match               *
    Add                 service hanihome-backend
    Add                 environment local
    Add                 container_host ${HOSTNAME}
    Add                 log_type container
    Add                 source logging_driver

# Spring Boot 로그 레벨별 태그 추가
[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals log_level ERROR
    Add                 severity error

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals log_level WARN
    Add                 severity warning

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals log_level INFO
    Add                 severity info

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals log_level DEBUG
    Add                 severity debug

# 불필요한 필드 제거
[FILTER]
    Name                modify
    Match               *
    Remove              container_id
    Remove              container_name
    Remove              source_type

# 민감한 정보 마스킹 (선택사항)
#[FILTER]
#     Name                modify
#     Match               docker.webapp
#     Condition           Key_value_matches message .*password.*
#     Set                 message [MASKED PASSWORD LOG]
#
# [FILTER]
#     Name                modify
#     Match               docker.webapp
#     Condition           Key_value_matches message .*token.*
#     Set                 message [MASKED TOKEN LOG]

# Loki 출력
[OUTPUT]
    Name              loki
    Match             *
    Host              ${MONITORING_SERVER_IP}
    Port              3100
    Labels            job=hanihome-backend,service=hanihome,environment=prod,container_host=${HOSTNAME},log_level=${LOG_LEVEL}
    Line_format       json
    Auto_kubernetes_labels off
    Remove_keys       container_host,service,environment

# 디버깅용
[OUTPUT]
    Name              stdout
    Match             *
    Format            json_lines