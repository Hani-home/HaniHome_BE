[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Logging Driver로부터 로그 수집
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Tag               docker.webapp

# Spring Boot 로그 파싱 및 구조화
[FILTER]
    Name                parser
    Match               docker.webapp
    Key_Name            log
    Parser              spring_boot
    Reserve_Data        On
    Preserve_Key        On

# 파싱 실패한 로그를 JSON으로 재시도
[FILTER]
    Name                parser
    Match               docker.webapp
    Key_Name            log
    Parser              spring_boot_json
    Reserve_Data        On
    Preserve_Key        On

# 운영환경 공통 필드 추가
[FILTER]
    Name                modify
    Match               *
    Add                 service hanihome-backend
    Add                 environment prod
    Add                 container_host ${HOSTNAME}
    Add                 log_type container
    Add                 source logging_driver

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals level ERROR
    Add                 severity error
    Add                 priority high
    Add                 log_level ERROR

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals level WARN
    Add                 severity warning
    Add                 priority medium
    Add                 log_level WARN

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals level INFO
    Add                 severity info
    Add                 priority low
    Add                 log_level INFO

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_equals level DEBUG
    Add                 severity debug
    Add                 log_level DEBUG

# 로그 레벨이 파싱되지 않은 경우 기본값 설정
[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_does_not_exist level
    Add                 log_level UNKNOWN
    Add                 severity info

; # DEBUG 로그 필터링 (운영환경에서 제외)
; [FILTER]
;     Name                grep
;     Match               docker.webapp
;     Exclude             log_level DEBUG

# 불필요한 필드 제거
[FILTER]
    Name                modify
    Match               *
    Remove              container_id
    Remove              container_name
    Remove              source_type

# 민감한 정보 마스킹
[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_matches message .*password.*
    Set                 message [MASKED PASSWORD LOG]

[FILTER]
    Name                modify
    Match               docker.webapp
    Condition           Key_value_matches message .*token.*
    Set                 message [MASKED TOKEN LOG]

[OUTPUT]
    Name              loki
    Match             *
    Host              ${MONITORING_SERVER_IP}
    Port              3100
    Labels            job=hanihome-backend,service=hanihome,environment=prod,container_host=${HOSTNAME}
    Line_format       json
    Auto_kubernetes_labels off
    Remove_keys       container_host,service,environment

